name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  id-token: write # Required for Azure OIDC login

jobs:
  # ------------------------------------------------------------------ #
  #  Build & Test
  # ------------------------------------------------------------------ #
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build Next.js (standalone)
        run: npm run build

      # Next.js standalone output needs the static + public dirs alongside server.js
      - name: Prepare deployment artifact
        run: |
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deploy
          retention-days: 5

  # ------------------------------------------------------------------ #
  #  Deploy to Staging
  # ------------------------------------------------------------------ #
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://app-grocery-planner-staging.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: deploy

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set application secrets that are NOT managed by Terraform
      # (to keep them out of TF state files)
      - name: Configure app secrets
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name app-grocery-planner-prod \
              --resource-group rg-grocery-planner-prod \
              --slot staging \
              --settings \
                ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                KROGER_CLIENT_ID="${{ secrets.KROGER_CLIENT_ID }}" \
                KROGER_CLIENT_SECRET="${{ secrets.KROGER_CLIENT_SECRET }}" \
                NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"

      - name: Deploy to staging slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-grocery-planner-prod
          slot-name: staging
          package: deploy

  # ------------------------------------------------------------------ #
  #  Deploy to Production (slot swap — zero downtime)
  # ------------------------------------------------------------------ #
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app-grocery-planner-prod.azurewebsites.net

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set production secrets before swap
      - name: Configure production secrets
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              --name app-grocery-planner-prod \
              --resource-group rg-grocery-planner-prod \
              --settings \
                ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
                KROGER_CLIENT_ID="${{ secrets.KROGER_CLIENT_ID }}" \
                KROGER_CLIENT_SECRET="${{ secrets.KROGER_CLIENT_SECRET }}" \
                NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"

      - name: Swap staging to production
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --name app-grocery-planner-prod \
              --resource-group rg-grocery-planner-prod \
              --slot staging \
              --target-slot production
